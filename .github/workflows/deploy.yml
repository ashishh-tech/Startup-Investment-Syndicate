name: CD Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-preview:
    name: Production Build & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_VAULT_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_VAULT_CONTRACT_ID }}
          NEXT_PUBLIC_DISTRIBUTOR_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_DISTRIBUTOR_CONTRACT_ID }}
