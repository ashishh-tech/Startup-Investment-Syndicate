name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts-test:
    name: Soroban Smart Contracts Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Pin breaking dependencies
        run: cargo update -p ed25519-dalek@3.0.0 --precise 2.1.1 || true

      - name: Run Soroban Contract Tests
        run: cargo test --workspace

  frontend-test:
    name: Frontend Lint & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Build Next.js
        run: npm run build
